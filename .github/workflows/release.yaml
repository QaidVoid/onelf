name: onelf release

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  publish-binaries:
    name: Publish binaries
    runs-on: ${{ matrix.build.RUNNER }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - {
              NAME: x86_64-linux,
              RUNNER: ubuntu-latest,
              TARGET: x86_64-unknown-linux-musl,
            }
          - {
              NAME: aarch64-linux,
              RUNNER: ubuntu-24.04-arm,
              TARGET: aarch64-unknown-linux-musl,
            }
          - {
              NAME: i686-linux,
              RUNNER: ubuntu-latest,
              TARGET: i686-unknown-linux-musl,
            }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set the release version
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF:11}" >> $GITHUB_ENV

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools b3sum

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
          targets: ${{ matrix.build.TARGET }}
          # llvm-tools provides rust-objcopy, used by build.rs to flatten the
          # bootstrap payload for this runner's architecture.
          components: rust-src, llvm-tools

      # There is no apt i686 musl gcc and no native i686 runner, so fetch a
      # prebuilt i686 musl cross toolchain. It compiles the C dependencies
      # (zstd), links the static musl binary, and builds the payloads.
      - name: Install i686 musl toolchain
        if: matrix.build.TARGET == 'i686-unknown-linux-musl'
        run: |
          url="https://toolchains.bootlin.com/downloads/releases/toolchains/x86-i686/tarballs/x86-i686--musl--stable-2024.05-1.tar.xz"
          mkdir -p "$HOME/i686-toolchain"
          curl -fsSL "$url" | tar -xJ -C "$HOME/i686-toolchain" --strip-components=1
          echo "$HOME/i686-toolchain/bin" >> "$GITHUB_PATH"

      # The payloads build for the `-gnu` triple, which is the host on the
      # x86_64/aarch64 runners but not for the i686 target, so add it there.
      - name: Add i686 payload target
        if: matrix.build.TARGET == 'i686-unknown-linux-musl'
        run: rustup target add i686-unknown-linux-gnu

      - name: Build
        # These name the i686 musl cross gcc installed above; cargo only
        # consults them for the i686 target, so they are inert elsewhere.
        env:
          CC_i686_unknown_linux_musl: i686-linux-gcc
          CARGO_TARGET_I686_UNKNOWN_LINUX_MUSL_LINKER: i686-linux-gcc
          ONELF_PAYLOAD_CC_I686: i686-linux-gcc
        run: cargo build --release --locked --target ${{ matrix.build.TARGET }}

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release
          cp {LICENSE,README.md} release/
          cp "target/${{ matrix.build.TARGET }}/release/onelf" release/

      - name: Create release artifacts
        shell: bash
        run: |
          cp release/onelf onelf-${{ matrix.build.NAME }}
          b3sum onelf-${{ matrix.build.NAME }} > onelf-${{ matrix.build.NAME }}.b3sum
          tar -cJvf onelf-${{ matrix.build.NAME }}.tar.xz release/
          b3sum onelf-${{ matrix.build.NAME }}.tar.xz > onelf-${{ matrix.build.NAME }}.tar.xz.b3sum

      - name: Upload to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: onelf-${{ matrix.build.NAME }}*
          file_glob: true
          overwrite: true
          tag: ${{ github.ref }}

      - name: Attest Build Provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: "onelf-${{ matrix.build.NAME }}"
          subject-path: onelf-${{ matrix.build.NAME }}*
