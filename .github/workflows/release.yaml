name: onelf release

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  publish-binaries:
    name: Publish binaries
    runs-on: ${{ matrix.build.RUNNER }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - {
              NAME: x86_64-linux,
              RUNNER: ubuntu-latest,
              TARGET: x86_64-unknown-linux-musl,
            }
          - {
              NAME: aarch64-linux,
              RUNNER: ubuntu-24.04-arm,
              TARGET: aarch64-unknown-linux-musl,
            }
          - {
              NAME: i686-linux,
              RUNNER: ubuntu-latest,
              TARGET: i686-unknown-linux-musl,
            }
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set the release version
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF:11}" >> $GITHUB_ENV

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools b3sum
          # i686 has no apt musl gcc; the glibc cross gcc drives the static
          # musl link and compiles the freestanding payloads.
          if [ "${{ matrix.build.TARGET }}" = "i686-unknown-linux-musl" ]; then
            sudo apt-get install -y --no-install-recommends gcc-i686-linux-gnu
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.build.TARGET }}
          # llvm-tools provides rust-objcopy, used by build.rs to flatten the
          # bootstrap payload for this runner's architecture.
          components: rust-src, llvm-tools

      # The payloads build for the `-gnu` triple, which is the host on the
      # x86_64/aarch64 runners but not for the i686 target, so add it there.
      - name: Add i686 payload target
        if: matrix.build.TARGET == 'i686-unknown-linux-musl'
        run: rustup target add i686-unknown-linux-gnu

      - name: Build
        # These are only consulted when building for i686-unknown-linux-musl
        # (runtime linker + CC) and i686 payloads, so they are inert on the
        # other targets.
        env:
          CC_i686_unknown_linux_musl: i686-linux-gnu-gcc
          CARGO_TARGET_I686_UNKNOWN_LINUX_MUSL_LINKER: i686-linux-gnu-gcc
          ONELF_PAYLOAD_CC_I686: i686-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.build.TARGET }}

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release
          cp {LICENSE,README.md} release/
          cp "target/${{ matrix.build.TARGET }}/release/onelf" release/

      - name: Create release artifacts
        shell: bash
        run: |
          cp release/onelf onelf-${{ matrix.build.NAME }}
          b3sum onelf-${{ matrix.build.NAME }} > onelf-${{ matrix.build.NAME }}.b3sum
          tar -cJvf onelf-${{ matrix.build.NAME }}.tar.xz release/
          b3sum onelf-${{ matrix.build.NAME }}.tar.xz > onelf-${{ matrix.build.NAME }}.tar.xz.b3sum

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: onelf-${{ matrix.build.NAME }}*
          file_glob: true
          overwrite: true
          tag: ${{ github.ref }}

      - name: Attest Build Provenance
        uses: actions/attest@v4
        with:
          subject-name: "onelf-${{ matrix.build.NAME }}"
          subject-path: onelf-${{ matrix.build.NAME }}*
