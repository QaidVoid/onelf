name: onelf ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Deliberately no `RUSTFLAGS: -D warnings`. Cargo applies RUSTFLAGS to
  # dependencies as well, so a warning in a crate we do not own would fail
  # the build. The deny lives on the clippy invocation, which scopes it to
  # this workspace.

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    # What this runner reliably provides. Declaring it makes a skip of
    # any other capability an announced skip rather than a failure, since
    # the capability jobs below own those claims, while a skip of one of
    # these still fails the job.
    env:
      ONELF_REQUIRED_CAPS: cc,patchelf,musl,glibc,hostlibs,staticlibc,fifo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # musl-tools supplies the musl gcc that build.rs needs to link the
      # embedded runtime. patchelf and fuse3 are what the pipeline tests
      # exercise; without them those tests silently take their skip paths
      # and stop covering the re-exec and FUSE behaviour.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            musl-tools patchelf fuse3

      # Installing fuse3 is not the same as being allowed to mount. The
      # runtime prefers unsharing a mount namespace, which the Ubuntu runner
      # denies to unprivileged users through AppArmor, and falls back to
      # the fusermount3 helper, which needs the fuse module present. The
      # tests probe for a real mount and skip themselves when it fails, so
      # this is what keeps them from skipping silently and leaving FUSE
      # uncovered. Best effort: a runner that refuses either knob still
      # runs the rest of the suite.
      - name: Allow FUSE mounts
        run: |
          sudo modprobe fuse || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          ls -l /dev/fuse || true

      # Stable, not nightly: the workspace has no nightly features, and a
      # lint gate that moves under the repository is worse than no gate.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
          # llvm-tools provides rust-objcopy, which build.rs uses to flatten
          # the bootstrap payload.
          components: rustfmt, clippy, llvm-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # The TOML rule loader is feature gated, so the workspace run above
      # never compiles its tests.
      - name: Test the TOML rule loader
        run: cargo test -p onelf-format --features rules-toml --locked

      # build.rs builds the embedded runtimes with --release only when the
      # onelf build itself is a release build, so the debug runs above
      # never produce the runtimes that ship.
      - name: Build the release runtimes
        run: cargo build --release -p onelf --locked

      - name: Inspect the release runtimes
        run: ci/check-runtimes.sh release

      # The self-update code builds only into the update runtime, so the
      # workspace build above never compiles its tests.
      - name: Lint and test the update runtime
        run: |
          cargo clippy -p onelf-rt --features update --all-targets --locked -- -D warnings
          cargo test -p onelf-rt --features update --locked

  # One job per capability the suite can only prove in the matching
  # environment. Each job names its claims in ONELF_REQUIRED_CAPS, so a
  # test that must skip for a claimed capability fails the job instead of
  # passing as a skip, and ci/preflight.sh rejects a runner whose
  # environment cannot honour the claim before cargo runs at all.
  namespace-fuse:
    name: Pipeline suite, namespace FUSE
    runs-on: ubuntu-latest
    env:
      ONELF_REQUIRED_CAPS: fuse,helperfuse,userns,tmpfs,cc,patchelf
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # squashfuse and squashfs-tools serve the preflight's real mount.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            musl-tools patchelf fuse3 squashfuse squashfs-tools

      # Best effort here on purpose: the preflight, not the sysctl exit
      # code, decides whether this runner may claim namespaces.
      - name: Allow namespace FUSE mounts
        run: |
          sudo modprobe fuse || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Preflight capabilities
        run: ci/preflight.sh namespace-fuse

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
          # llvm-tools provides rust-objcopy, which build.rs uses to flatten
          # the bootstrap payload.
          components: llvm-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Pipeline tests
        run: cargo test -p onelf --locked --test pipeline

  helper-fuse:
    name: Pipeline suite, helper FUSE only
    runs-on: ubuntu-latest
    env:
      ONELF_REQUIRED_CAPS: fuse,helperfuse,cc,patchelf
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # squashfuse and squashfs-tools serve the preflight's real mount.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            musl-tools patchelf fuse3 squashfuse squashfs-tools

      # Mounts must come from the setuid fusermount3 helper alone, so the
      # user-namespace knob stays at the Ubuntu runner's denying default. The
      # preflight refuses a runner where unshare still succeeds, since
      # such a runner would not be exercising the helper path at all.
      - name: Allow the helper mount, keep namespaces denied
        run: |
          sudo modprobe fuse || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1 || true

      - name: Preflight capabilities
        run: ci/preflight.sh helper-fuse

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
          components: llvm-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Pipeline tests
        run: cargo test -p onelf --locked --test pipeline

  no-fuse:
    name: Pipeline suite, extraction fallback
    runs-on: ubuntu-latest
    env:
      ONELF_REQUIRED_CAPS: cc,patchelf
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Deliberately no fuse3: the fallback claim needs a host that
      # cannot mount anything.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            musl-tools patchelf

      # A leftover helper or device node could still mount, and then the
      # launches this job runs would not take the extraction fallback it
      # exists to cover. The preflight fails on any of the three.
      # The runner image ships fuse3 whether or not a job asks for it.
      - name: Take FUSE off the runner
        run: |
          sudo apt-get remove -y --purge fuse3 fuse 2>/dev/null || true
          sudo modprobe -r fuse 2>/dev/null || true
          sudo rm -f /dev/fuse

      - name: Preflight capabilities
        run: ci/preflight.sh no-fuse

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
          components: llvm-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Pipeline tests
        run: cargo test -p onelf --locked --test pipeline

  cache:
    name: Pipeline tests, extraction cache
    runs-on: ubuntu-latest
    env:
      ONELF_REQUIRED_CAPS: cc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Preflight capabilities
        run: ci/preflight.sh cache

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
          components: llvm-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cache tests
        run: cargo test -p onelf --locked --test pipeline -- cache

  privileged-import:
    name: Pipeline tests, privileged root imports
    runs-on: ubuntu-latest
    env:
      ONELF_REQUIRED_CAPS: root,fuse,helperfuse
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            musl-tools fuse3 squashfuse squashfs-tools

      - name: Allow namespace FUSE mounts
        run: |
          sudo modprobe fuse || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # The preflight itself must run as root, so it probes the same uid
      # the tests will run under.
      - name: Preflight capabilities
        run: sudo ci/preflight.sh privileged-import

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
          components: llvm-tools

      # The root guarantees are written against a real uid transition, so
      # the tests that hold them run as actual uid 0, not a mapped one.
      # The runner's sudo ignores -E, so root gets the toolchain and the
      # capability claims it needs by name.
      - name: Privileged tests as root
        run: sudo env "PATH=$PATH" "HOME=$HOME" "CARGO_HOME=$CARGO_HOME" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "CI=$CI" "ONELF_REQUIRED_CAPS=$ONELF_REQUIRED_CAPS" "CARGO_TERM_COLOR=$CARGO_TERM_COLOR" cargo test -p onelf --locked --test pipeline -- root_serves root_neither root_leaves

      # The import races (a source mutated or replaced mid-copy, an unsafe
      # source, fetch prohibition) as the uid they defend.
      - name: Import race tests as root
        run: sudo env "PATH=$PATH" "HOME=$HOME" "CARGO_HOME=$CARGO_HOME" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "CI=$CI" "ONELF_REQUIRED_CAPS=$ONELF_REQUIRED_CAPS" "CARGO_TERM_COLOR=$CARGO_TERM_COLOR" cargo test -p onelf-rt --locked import

  # The media stack checks and the traced read counters. The job
  # installs GStreamer with its scanner and base plugins, ALSA headers,
  # configuration and plugins, a PipeWire server and strace, starts the
  # server headless on the runtime directory the PipeWire fixture
  # bridges to, and claims each of those capabilities, so none of these
  # tests can pass as a skip.
  media:
    name: Media stack and traced scale checks
    runs-on: ubuntu-latest
    env:
      ONELF_REQUIRED_CAPS: cc,musl,strace,gstreamer,gstreamer-scanner,gstreamer-plugins,alsa,alsa-devel,alsa-config,pipewire,pipewire-server,pipewire-config
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            musl-tools patchelf strace pkg-config \
            gstreamer1.0-tools gstreamer1.0-plugins-base libgstreamer1.0-0 \
            libasound2-dev libasound2-data libasound2-plugins alsa-utils \
            pipewire pipewire-bin

      # The PipeWire fixture links its runtime directory to
      # /run/user/<uid>/pipewire-0, so the server listens there. A runner
      # has no login session, so the directory is made by hand.
      - name: Start a headless PipeWire server
        run: |
          run_dir="/run/user/$(id -u)"
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$run_dir"
          echo "XDG_RUNTIME_DIR=$run_dir" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$run_dir" nohup pipewire > "$RUNNER_TEMP/pipewire.log" 2>&1 &
          for _ in $(seq 1 50); do
            if XDG_RUNTIME_DIR="$run_dir" pw-cli info 0 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/pipewire.log"
          exit 1

      - name: Preflight capabilities
        run: ci/preflight.sh media

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
          components: llvm-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Media and traced scale tests
        run: >-
          cargo test -p onelf --locked --test pipeline --
          a_packed_pipeline_plays_through_the_pack_scanner
          hostile_user_alsa_snippets_leave_the_private_stack_working
          hostile_pipewire_config_leaves_the_private_spa_stack_connected
          traced_reads_stay_per_object_whatever_the_rules_in_play_or_the_tree_size
          a_musl_target_without_its_interpreter_is_still_traced

      - name: PipeWire server log
        if: always()
        run: cat "$RUNNER_TEMP/pipewire.log" || true

  # The pinned distro fixtures drive docker directly: six images from
  # ci/fixtures/Dockerfile.* (base tags pinned by digest, packages
  # installed only at image-prep time) run the application fixtures
  # and the static musl runtime checks inside Ubuntu 24.04, Alpine
  # 3.20 and Fedora 44; the audio matrix assembles, packs and plays
  # the audio fixture inside Ubuntu 22.04, Debian 12, Arch, Fedora 44
  # and Alpine 3.20; and the GTK and Qt packages also run on the
  # bare base of the other libc family. The audio matrix plays its
  # fixture against a PipeWire server each cell starts inside its own
  # container, with the session manager that distro's sound stack
  # ships, and the descriptor-free framework
  # fixture launches both with and without a user namespace. Containers
  # run without network and print their image IDs. The job claims
  # docker in ONELF_REQUIRED_CAPS, so a runner without docker fails the
  # preflight, and a fixture test that skips for any reason fails the
  # job instead of passing as a skip.
  distro-fixtures:
    name: Distro fixtures, six pinned hosts
    runs-on: ubuntu-latest
    env:
      ONELF_REQUIRED_CAPS: docker
      ONELF_DISTRO_FIXTURES: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # musl-tools supplies the musl gcc that builds the static musl
      # onelf the containers drive. docker itself ships on the runner;
      # the preflight refuses a runner where it does not work.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Preflight capabilities
        run: ci/preflight.sh distro

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
          # llvm-tools provides rust-objcopy, which build.rs uses to flatten
          # the bootstrap payload.
          components: llvm-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The offline builds below, and the one the test itself falls back
      # to, need every crate already downloaded.
      - name: Fetch dependencies
        run: cargo fetch --locked

      # Built before the tests so the in-test build of the same binary
      # is a cache hit and stays offline.
      - name: Build the static musl onelf
        run: cargo build -p onelf --locked --offline --target x86_64-unknown-linux-musl

      # --nocapture keeps the recorded image IDs in the log.
      - name: Distro fixture tests
        run: cargo test -p onelf --locked --test distro_fixtures -- --nocapture
