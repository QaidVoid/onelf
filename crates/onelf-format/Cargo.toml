[package]
name = "onelf-format"
description = "Binary format definitions for onelf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
rules-toml = ["dep:toml"]

[dependencies]
blake3 = { workspace = true }
xxhash-rust = { workspace = true }
stipplefs = { workspace = true, features = ["read", "zstd"] }
toml = { workspace = true, optional = true }

[build-dependencies]
toml = { workspace = true }
