schema = 1
id = "alsa"

[[triggers]]
soname-prefix = "libasound.so"

[[resources.plugins]]
id = "plugins"
kind = "directory"
destination = "lib/alsa-lib"
requirement = "optional"
candidates = [{ base = "library-dir", path = "alsa-lib" }]

[[resources.data]]
id = "configuration"
kind = "directory"
destination = "share/alsa"
requirement = "required"
candidates = [{ base = "installation-prefix", path = "share/alsa" }]

[build]
hooks = ["alsa_conf_patch"]

[runtime]
hooks = ["alsa_config_path_natural_sort"]

[[runtime.paths]]
id = "plugins"
kind = "directory"
variables = ["ALSA_PLUGIN_DIR"]
selection = "first"
inheritance = "replace"
candidates = [{ base = "library-root", path = "alsa-lib" }]

[[runtime.paths]]
id = "configuration"
kind = "directory"
variables = ["ALSA_CONFIG_DIR"]
selection = "first"
inheritance = "replace"
candidates = [{ base = "package-root", path = "share/alsa" }]
