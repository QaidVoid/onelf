schema = 1
id = "heif"

[[triggers]]
soname-prefix = "libheif.so"

[[runtime.paths]]
id = "plugins"
kind = "directory"
variables = ["LIBHEIF_PLUGIN_PATH"]
selection = "first-per-library-root"
inheritance = "replace"
candidates = [
  { base = "library-root", path = "libheif/plugins" },
  { base = "library-root", path = "libheif" },
]
