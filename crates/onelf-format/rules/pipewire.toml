schema = 1
id = "pipewire"

[[triggers]]
soname-prefix = "libpipewire-0.3.so"

[[resources.plugins]]
id = "plugins"
kind = "directory"
destination = "lib/pipewire-0.3"
requirement = "optional"
candidates = [
  { base = "library-dir", path = "pipewire-0.3" },
]
# The modules client.conf loads into an application's context. The rest
# serve the PipeWire daemon and the session manager.
members = [
  "libpipewire-module-rt.so",
  "libpipewire-module-protocol-native.so",
  "libpipewire-module-client-node.so",
  "libpipewire-module-client-device.so",
  "libpipewire-module-adapter.so",
  "libpipewire-module-metadata.so",
  "libpipewire-module-session-manager.so",
]

# A client context fails without client.conf, and the bundled library
# looks for it only under its own build prefix.
[[resources.data]]
id = "configuration"
kind = "file"
destination = "share/pipewire/client.conf"
requirement = "optional"
candidates = [
  { base = "installation-prefix", path = "share/pipewire/client.conf" },
]

# Realtime clients before pipewire 1.4 load client-rt.conf for their
# context, and a configuration directory that misses it fails the
# context outright wherever the package's configuration directory is
# mapped.
[[resources.data]]
id = "configuration-rt"
kind = "file"
destination = "share/pipewire/client-rt.conf"
requirement = "optional"
candidates = [
  { base = "installation-prefix", path = "share/pipewire/client-rt.conf" },
]

[[runtime.paths]]
id = "plugins"
kind = "directory"
variables = ["PIPEWIRE_MODULE_DIR"]
selection = "all"
inheritance = "replace"
candidates = [
  { base = "library-root", path = "pipewire-0.3" },
]

[[runtime.paths]]
id = "configuration"
kind = "directory"
variables = ["PIPEWIRE_CONFIG_DIR"]
selection = "first"
inheritance = "preserve"
candidates = [
  { base = "package-root", path = "share/pipewire" },
]
