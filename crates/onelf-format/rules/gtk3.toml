schema = 1
id = "gtk3"

[[triggers]]
soname-prefix = "libgtk-3.so"

[[resources.plugins]]
id = "modules"
kind = "directory"
destination = "lib/gtk-3.0"
requirement = "optional"
candidates = [
  { base = "library-dir", path = "gtk-3.0" },
]

[[runtime.paths]]
id = "modules"
kind = "directory"
variables = ["GTK_PATH"]
selection = "all"
inheritance = "replace"
candidates = [
  { base = "library-root", path = "gtk-3.0" },
]
