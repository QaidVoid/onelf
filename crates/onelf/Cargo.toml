[package]
name = "onelf"
description = "Packer CLI for creating onelf single-binary packages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = { workspace = true }
clap = { workspace = true }
# Publisher-side signing. Same major as the runtime's verifier so both
# agree on the key and signature encodings.
ed25519-compact = { version = "2", default-features = false, features = [
    "random",
    "std",
] }
goblin = { workspace = true }
indicatif = { workspace = true }
onelf-format = { workspace = true }
jwalk = { workspace = true }
rayon = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
xxhash-rust = { workspace = true }
zstd = { workspace = true, features = ["zdict_builder"] }

[dev-dependencies]
# The integration test verifies a signature the way the runtime does, so
# it decodes with the same crate the runtime's verifier uses.
ed25519-compact = { version = "2", default-features = false, features = [
    "random",
    "std",
] }
