[package]
name = "onelf"
description = "Packer CLI for creating onelf single-binary packages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = { workspace = true }
clap = { workspace = true }
# Publisher-side signing. Same major as the runtime's verifier so both
# agree on the key and signature encodings.
ed25519-compact = { version = "2", default-features = false, features = [
    "random",
    "std",
] }
goblin = { workspace = true }
indicatif = { workspace = true }
# The TOML adapter parses a recipe's project-local rule files. The
# runtime never enables it.
onelf-format = { workspace = true, features = ["rules-toml"] }
onelf-sysroot = { workspace = true }
# Shared launch support for the development run: acquisition, set
# selection, and the pinned-artifact store. Default features only, so
# the updater and its HTTPS dependencies stay out of this build.
onelf-rt = { path = "../onelf-rt", version = "0.6.0" }
jwalk = { workspace = true }
rayon = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
stipplefs = { workspace = true, features = ["write", "read", "fs", "dict"] }
toml = { workspace = true }
# `onelf sysroot fetch`: the same client the runtime's updater uses, so
# both trust the platform's certificate store.
ureq = { version = "3", features = ["platform-verifier"] }
xxhash-rust = { workspace = true }
zstd = { workspace = true, features = ["zdict_builder"] }

[dev-dependencies]
# The integration test verifies a signature the way the runtime does, so
# it decodes with the same crate the runtime's verifier uses.
ed25519-compact = { version = "2", default-features = false, features = [
    "random",
    "std",
] }
