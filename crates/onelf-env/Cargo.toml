[package]
name = "onelf-env"
description = "Constructor library that re-applies onelf .onelf/env and .onelf/preload on every exec (survives sandboxed re-exec)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib is what gets bundled; rlib lets `cargo test` build a harness.
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
